name: TestFlight

# Builds a signed App Store build and uploads it to TestFlight.
# Setup (certificate, API key, secrets) is described in docs/testflight.md.

on:
  workflow_dispatch:
    inputs:
      build_number:
        description: 'Build number (CFBundleVersion). Leave empty to use the commit count; must be higher than the last uploaded build.'
        required: false
        default: ''

permissions:
  contents: read

concurrency:
  group: testflight-${{ github.ref }}
  cancel-in-progress: false

jobs:
  testflight:
    runs-on: macos-26
    timeout-minutes: 360
    env:
      BAZEL_CACHE_DIR: /Users/Shared/bazel-disk-cache
      SOURCE_DIR: /Users/Shared/telegram-ios

    steps:
      # Two setups are supported (docs/testflight.md):
      #  - API: a team App Store Connect API key creates the profiles and uploads the build
      #  - manual: profiles made by the account owner (IOS_PROFILES_ZIP_BASE64), upload with an Apple ID
      #    app-specific password
      - name: Check secrets
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          IOS_DIST_CERT_P12_BASE64: ${{ secrets.IOS_DIST_CERT_P12_BASE64 }}
          IOS_DIST_CERT_PASSWORD: ${{ secrets.IOS_DIST_CERT_PASSWORD }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_PRIVATE_KEY: ${{ secrets.ASC_PRIVATE_KEY }}
          IOS_PROFILES_ZIP_BASE64: ${{ secrets.IOS_PROFILES_ZIP_BASE64 }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
        run: |
          check() {
            local missing=""
            for name in "$@"; do
              if [ -z "${!name}" ]; then missing="$missing $name"; fi
            done
            echo "$missing"
          }
          if [ -n "$IOS_PROFILES_ZIP_BASE64" ]; then
            mode=manual
            missing=$(check APPLE_TEAM_ID IOS_DIST_CERT_P12_BASE64 IOS_DIST_CERT_PASSWORD APPLE_ID APPLE_APP_PASSWORD)
          else
            mode=api
            missing=$(check APPLE_TEAM_ID IOS_DIST_CERT_P12_BASE64 IOS_DIST_CERT_PASSWORD ASC_KEY_ID ASC_ISSUER_ID ASC_PRIVATE_KEY)
          fi
          if [ -n "$missing" ]; then
            echo "::error::Missing repository secrets for the $mode setup:$missing (see docs/testflight.md)"
            exit 1
          fi
          echo "SIGNING_MODE=$mode" >> $GITHUB_ENV
          echo "Signing setup: $mode"

      - uses: actions/checkout@v4
        with:
          submodules: 'recursive'
          fetch-depth: '0'
          persist-credentials: false

      - name: Set active Xcode path
        run: |
          XCODE_VERSION=$(cat versions.json | python3 -c 'import json,sys;obj=json.load(sys.stdin);print(obj["xcode"]);')
          sudo xcode-select -s /Applications/Xcode_$XCODE_VERSION.app/Contents/Developer
          echo "XCODE_VERSION=$XCODE_VERSION" >> $GITHUB_ENV
          xcodebuild -version

      - name: Create canonical source directory
        run: |
          set -x
          sudo mkdir -p /Users/Shared
          mv "$GITHUB_WORKSPACE" "$SOURCE_DIR"
          mkdir -p "$GITHUB_WORKSPACE"

      - name: Restore bazel cache
        uses: actions/cache/restore@v4
        with:
          path: ${{ env.BAZEL_CACHE_DIR }}
          key: bazel-${{ runner.os }}-${{ runner.arch }}-xcode${{ env.XCODE_VERSION }}-${{ github.run_id }}
          restore-keys: |
            bazel-${{ runner.os }}-${{ runner.arch }}-xcode${{ env.XCODE_VERSION }}-

      - name: Prepare code signing
        working-directory: ${{ env.SOURCE_DIR }}
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          IOS_DIST_CERT_P12_BASE64: ${{ secrets.IOS_DIST_CERT_P12_BASE64 }}
          IOS_DIST_CERT_PASSWORD: ${{ secrets.IOS_DIST_CERT_PASSWORD }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_PRIVATE_KEY: ${{ secrets.ASC_PRIVATE_KEY }}
          IOS_PROFILES_ZIP_BASE64: ${{ secrets.IOS_PROFILES_ZIP_BASE64 }}
        run: |
          set -e
          SIGNING_DIR="$RUNNER_TEMP/signing"
          PROFILES_DIR="$SIGNING_DIR/codesigning/profiles"
          mkdir -p "$SIGNING_DIR/codesigning/certs" "$PROFILES_DIR"
          echo "SIGNING_DIR=$SIGNING_DIR" >> $GITHUB_ENV

          echo "$IOS_DIST_CERT_P12_BASE64" | base64 --decode > "$SIGNING_DIR/distribution.p12"
          BUNDLE_ID=$(python3 -c 'import json;print(json.load(open("build-system/appstore-configuration.json"))["bundle_id"])')

          if [ "$SIGNING_MODE" = "manual" ]; then
            echo "$IOS_PROFILES_ZIP_BASE64" | base64 --decode > "$SIGNING_DIR/profiles.zip"
            # flatten: the zip may contain the profiles in a folder
            unzip -j -o "$SIGNING_DIR/profiles.zip" '*.mobileprovision' -d "$PROFILES_DIR"
            python3 .github/scripts/appstoreconnect_profiles.py \
              --check-dir "$PROFILES_DIR" \
              --bundle-id "$BUNDLE_ID" \
              --team-id "$APPLE_TEAM_ID" \
              --p12-path "$SIGNING_DIR/distribution.p12"
          else
            mkdir -p ~/.appstoreconnect/private_keys
            printf '%s\n' "$ASC_PRIVATE_KEY" > ~/.appstoreconnect/private_keys/AuthKey_${ASC_KEY_ID}.p8
            python3 -m venv "$RUNNER_TEMP/venv"
            "$RUNNER_TEMP/venv/bin/pip" install --quiet 'pyjwt[crypto]'
            "$RUNNER_TEMP/venv/bin/python" .github/scripts/appstoreconnect_profiles.py \
              --bundle-id "$BUNDLE_ID" \
              --key-id "$ASC_KEY_ID" \
              --issuer-id "$ASC_ISSUER_ID" \
              --private-key-path ~/.appstoreconnect/private_keys/AuthKey_${ASC_KEY_ID}.p8 \
              --p12-path "$SIGNING_DIR/distribution.p12" \
              --output "$PROFILES_DIR"
          fi

          # same configuration as the CI build, but signed by our team
          python3 - "$SIGNING_DIR/configuration.json" <<'EOF'
          import json, os, sys
          config = json.load(open('build-system/appstore-configuration.json'))
          config['team_id'] = os.environ['APPLE_TEAM_ID']
          json.dump(config, open(sys.argv[1], 'w'), indent=2)
          EOF

      - name: Build the App
        working-directory: ${{ env.SOURCE_DIR }}
        env:
          IOS_DIST_CERT_PASSWORD: ${{ secrets.IOS_DIST_CERT_PASSWORD }}
          INPUT_BUILD_NUMBER: ${{ inputs.build_number }}
        run: |
          set -x

          BAZEL_USER_ROOT="/private/var/tmp/_bazel_containerhost"

          if [ -n "$INPUT_BUILD_NUMBER" ]; then
            BUILD_NUMBER="$INPUT_BUILD_NUMBER"
          else
            BUILD_NUMBER="$(($(git rev-list --count HEAD) + $(cat build_number_offset)))"
          fi
          APP_VERSION=$(cat versions.json | python3 -c 'import json,sys;obj=json.load(sys.stdin);print(obj["app"]);')
          echo "BUILD_NUMBER=$BUILD_NUMBER" >> $GITHUB_ENV
          echo "APP_VERSION=$APP_VERSION" >> $GITHUB_ENV

          # creates temp.keychain with the Apple WWDR intermediate; then add the distribution identity
          python3 build-system/Make/ImportCertificates.py --path "$SIGNING_DIR/codesigning/certs"
          set +x
          security import "$SIGNING_DIR/distribution.p12" -k temp.keychain -P "$IOS_DIST_CERT_PASSWORD" -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple: -k secret temp.keychain > /dev/null
          set -x
          security find-identity -v -p codesigning temp.keychain

          rm -rf build/artifacts
          python3 -u build-system/Make/Make.py \
            --bazelUserRoot="$BAZEL_USER_ROOT" \
            --cacheDir="$BAZEL_CACHE_DIR" \
            build \
            --configurationPath="$SIGNING_DIR/configuration.json" \
            --codesigningInformationPath="$SIGNING_DIR/codesigning" \
            --configuration=release_arm64 \
            --buildNumber="$BUILD_NUMBER" \
            --outputBuildArtifactsPath=build/artifacts

          ls -la build/artifacts

      - name: Save bazel cache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: ${{ env.BAZEL_CACHE_DIR }}
          key: bazel-${{ runner.os }}-${{ runner.arch }}-xcode${{ env.XCODE_VERSION }}-${{ github.run_id }}

      - name: Upload to TestFlight
        working-directory: ${{ env.SOURCE_DIR }}
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
          ASC_PROVIDER: ${{ secrets.ASC_PROVIDER }}
        run: |
          set -o pipefail
          if [ "$SIGNING_MODE" = "manual" ]; then
            # altool can't upload with an individual API key, so the manual setup uses the Apple ID of a user
            # who only has access to this app
            auth=(--username "$APPLE_ID" --password "$APPLE_APP_PASSWORD")
            # an Apple ID that belongs to several teams needs the provider short name (see the list below)
            xcrun altool --list-providers "${auth[@]}" || true
            if [ -n "$ASC_PROVIDER" ]; then auth+=(--asc-provider "$ASC_PROVIDER"); fi
          else
            auth=(--apiKey "$ASC_KEY_ID" --apiIssuer "$ASC_ISSUER_ID")
          fi
          # Xcode 26 altool can exit with 0 after a failed upload, so check its output as well
          xcrun altool --upload-app --type ios \
            --file build/artifacts/Telegram.ipa \
            "${auth[@]}" 2>&1 | tee "$RUNNER_TEMP/altool.log"
          if ! grep -qE "UPLOAD SUCCEEDED|No errors uploading" "$RUNNER_TEMP/altool.log"; then
            echo "::error::Upload to App Store Connect failed, see the altool output above"
            exit 1
          fi

      - name: Upload build artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Voxgram-TestFlight-${{ env.APP_VERSION }}-${{ env.BUILD_NUMBER }}
          path: |
            ${{ env.SOURCE_DIR }}/build/artifacts/Telegram.ipa
            ${{ env.SOURCE_DIR }}/build/artifacts/Telegram.DSYMs.zip
          if-no-files-found: ignore

      - name: Clean up signing material
        if: always()
        run: |
          security delete-keychain temp.keychain || true
          rm -rf "$RUNNER_TEMP/signing" ~/.appstoreconnect/private_keys
